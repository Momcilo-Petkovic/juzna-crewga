# Juzna Crewga backend. This file is committed and contains NO secrets.
# Real local values go in application-local.properties (gitignored), next to pom.xml.
spring.application.name=juzna-crewga
spring.config.import=optional:file:./application-local.properties

# Database (MariaDB)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/juzna_crewga}
spring.datasource.username=${DB_USER:juzna_crewga}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate creates and updates the tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}